
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Plein Écran</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* Animation pour faire clignoter le texte */
  @keyframes clignoter {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
  }
  /* Style pour le texte en bas à gauche avec animation */
  .bottom-left-text {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: red;
    font-weight: bold;
    font-size: 1.2em;
    z-index: 10;
    animation: clignoter 1s infinite;
  }
</style>
</head>
<body>
<img src="IEJP_ItinerairesJardins.png" alt="Image" />
<div class="bottom-left-text">Ceci est un photomontage</div>
</body>
</html>
